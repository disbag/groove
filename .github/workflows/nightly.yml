name: Nightly update

on:
  schedule:
    # 00:17 по Москве. Запуски по расписанию GitHub задерживает на несколько часов (в сентябре 2026 — до ~5 ч),
    # поэтому ставим с запасом до утра и не на начало часа — в это время очередь самая длинная.
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Лимит времени на сопоставление с Discogs, минут"
        default: "240"
      retry_not_found:
        description: "Заново проверить ненайденные позиции (после улучшения сопоставления)"
        type: boolean
        default: false
      export_only:
        description: "Только пересобрать сайт из базы, без сбора и сопоставления (несколько минут)"
        type: boolean
        default: false

permissions:
  contents: write # коммит status/last_run.json (без активности GitHub через 60 дней выключает cron)
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      GROOVE_SHOPS_EXCLUDE: pult # отвечает 403 серверам GitHub — собирается локально (scripts/local_run.sh)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сбор цен, сопоставление, экспорт
        run: |
          if [ "${{ inputs.export_only }}" = "true" ]; then
            python -m pipeline migrate && python -m pipeline export
          else
            python -m pipeline nightly --budget-minutes "${{ inputs.budget_minutes || '240' }}" ${{ inputs.retry_not_found && '--retry-not-found' || '' }}
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка сайта
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Коммит статуса прогона
        if: always()
        continue-on-error: true # сбой коммита статуса не должен блокировать публикацию сайта
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ || true
          git commit -m "status: $(date -u +%F)" || { echo "нет изменений"; exit 0; }
          # за время прогона в main могли появиться новые коммиты
          for attempt in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
