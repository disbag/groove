name: Nightly update

on:
  schedule:
    - cron: "30 0 * * *" # 03:30 по Москве
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Лимит времени на сопоставление с Discogs, минут"
        default: "240"

permissions:
  contents: write # коммит status/last_run.json (без активности GitHub через 60 дней выключает cron)
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      GROOVE_SHOPS_EXCLUDE: pult # отвечает 403 серверам GitHub — собирается локально (scripts/local_run.sh)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сбор цен, сопоставление, экспорт
        run: python -m pipeline nightly --budget-minutes "${{ inputs.budget_minutes || '240' }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка сайта
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Коммит статуса прогона
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ || true
          git commit -m "status: $(date -u +%F)" || echo "нет изменений"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
